workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate missing platform folders
        script: |
          flutter create . --platforms=android
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
